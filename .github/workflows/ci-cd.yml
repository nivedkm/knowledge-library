name: CI – Build, Test, Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      WISDOM_DATABASE_URL: postgresql+psycopg://postgres:nGR9bMPsnX4dR@db.fukleulfjsvmlzkxthxi.supabase.co:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: knowledge-library
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nGR9bMPsnX4dR
        options: >-
          --health-cmd "pg_isready -U wisdom -d wisdom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGPASSWORD=wisdom
          until pg_isready -h localhost -p 5432 -U wisdom; do sleep 1; done
      - name: Install backend deps
        run: |
          cd backend
          uv sync --frozen --group dev
      - name: Run DB migrations
        run: |
          cd backend
          uv run alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          uv run pytest -q

  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
