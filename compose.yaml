version: "3.9"

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: wisdom-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wisdom}
      POSTGRES_USER: ${POSTGRES_USER:-wisdom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wisdom}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wisdom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-wisdom} -d ${POSTGRES_DB:-wisdom}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  wisdom_postgres_data:

